<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shashank | Enter</title>
    <style>
        /* Modern, bold fonts */
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            /* Animated gradient background */
            background: linear-gradient(45deg, #0f172a, #1e293b, #0ea5e9, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            perspective: 1000px; /* Required for the 3D mouse effect */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Container that will tilt with the mouse */
        .interactive-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        /* The Profile Picture */
        .profile-wrapper {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 30px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            /* Pushes the image forward in 3D space */
            transform: translateZ(50px); 
        }

        .profile-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(120%);
            transition: 0.5s;
        }

        .profile-wrapper:hover img {
            filter: grayscale(0%) contrast(100%);
            transform: scale(1.1);
        }

        /* Massive Modern Typography */
        h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: 5rem;
            text-transform: uppercase;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.8);
            letter-spacing: 5px;
            margin-bottom: 10px;
            /* Pushes text forward in 3D space */
            transform: translateZ(80px); 
        }

        p {
            color: #94a3b8;
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 40px;
            transform: translateZ(30px);
        }

        /* Slick Modern Button */
        .enter-btn {
            padding: 15px 40px;
            background: #fff;
            color: #0f172a;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.4s;
            transform: translateZ(60px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
        }

        .enter-btn:hover {
            background: #0ea5e9;
            color: #fff;
            box-shadow: 0 15px 40px rgba(14, 165, 233, 0.5);
            transform: translateZ(60px) scale(1.05);
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .profile-wrapper { width: 150px; height: 150px; }
        }
    </style>
</head>
<body>

    <div class="interactive-container" id="tilt-box">
        <div class="profile-wrapper">
            <!-- Ensure my-photo.jpg is still in your folder! -->
            <img src="my-photo1.jpg.jpeg" alt="Shashank">
        </div>
        
        <h1>Shashank</h1>
        <p>Aspiring Software Developer</p>
        
        <a href="portfolio.html" class="enter-btn">Enter Experience</a>
    </div>

    <!-- JavaScript for the 3D Parallax Mouse Effect -->
    <script>
        const tiltBox = document.getElementById('tilt-box');

        // Listens for the mouse moving across the whole screen
        document.addEventListener('mousemove', (event) => {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            // Calculates where the mouse is relative to the center of the screen
            const mouseX = event.clientX;
            const mouseY = event.clientY;
            
            // Creates the math to slightly tilt the box based on mouse position
            const rotateX = ((windowHeight / 2) - mouseY) / 25;
            const rotateY = (mouseX - (windowWidth / 2)) / 25;

            // Applies the tilt to our container
            tiltBox.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        // Resets the tilt when the mouse leaves the screen
        document.addEventListener('mouseleave', () => {
            tiltBox.style.transform = `rotateX(0deg) rotateY(0deg)`;
            tiltBox.style.transition = `transform 0.5s ease-out`;
        });

        // Removes the transition delay while moving so it feels instant and smooth
        document.addEventListener('mouseenter', () => {
            tiltBox.style.transition = `transform 0.1s ease-out`;
        });
    </script>

</body>
</html>
